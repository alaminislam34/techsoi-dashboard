services:
  app:
    image: alaminislam34/techsoi-dashboard:latest
    container_name: techsoi-dashboard-prod
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      BASE_URL: ${BASE_URL:-https://api.techsoibd.com/api}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://api.techsoibd.com/api}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s